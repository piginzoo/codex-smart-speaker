<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1026"/>
      <stop offset="0.55" stop-color="#101a3d"/>
      <stop offset="1" stop-color="#1a1030"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4f8cff"/>
      <stop offset="1" stop-color="#9d6bff"/>
    </linearGradient>
    <linearGradient id="orb" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2f6bff"/>
      <stop offset="1" stop-color="#b9c8f7"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="420" fill="url(#bg)"/>
  <!-- 淡淡的声波纹样 -->
  <g stroke="#2a3b6e" stroke-width="1" opacity="0.5" fill="none">
    <path d="M0 330 Q75 310 150 330 T300 330 T450 330 T600 330 T750 330 T900 330 T1050 330 T1200 330"/>
    <path d="M0 350 Q75 322 150 350 T300 350 T450 350 T600 350 T750 350 T900 350 T1050 350 T1200 350"/>
    <path d="M0 370 Q75 334 150 370 T300 370 T450 370 T600 370 T750 370 T900 370 T1050 370 T1200 370"/>
  </g>

  <text x="60" y="86" font-size="46" font-weight="700" fill="#ffffff">Codex Smart Speaker</text>
  <text x="60" y="124" font-size="20" fill="#8fa3d9">把一台 2018 年的老 Galaxy S9 变成小度音箱 · 大脑是 ChatGPT Live</text>

  <!-- 管线 -->
  <g>
    <!-- 手机 -->
    <rect x="530" y="150" width="140" height="230" rx="18" fill="#0d1330" stroke="url(#accent)" stroke-width="2.5"/>
    <rect x="545" y="172" width="110" height="176" rx="8" fill="#f2f4fb"/>
    <circle cx="600" cy="245" r="38" fill="url(#orb)" filter="url(#glow)"/>
    <text x="600" y="330" font-size="13" fill="#8fa3d9" text-anchor="middle">Galaxy S9</text>

    <!-- 唤醒词 -->
    <g filter="url(#glow)">
      <rect x="80" y="180" width="200" height="72" rx="14" fill="#0d1330" stroke="#4f8cff" stroke-width="2"/>
      <text x="180" y="210" font-size="17" fill="#ffffff" text-anchor="middle">「Codex」</text>
      <text x="180" y="234" font-size="12" fill="#8fa3d9" text-anchor="middle">离线唤醒词 · Vosk</text>
    </g>
    <path d="M285 216 L520 216" stroke="url(#accent)" stroke-width="2.5" marker-end="url(#arrow)"/>
    <text x="400" y="204" font-size="12" fill="#5f74ad" text-anchor="middle">自动亮屏 · 拉起 App · 进语音</text>

    <!-- 音波 -->
    <g stroke="url(#accent)" stroke-width="3" stroke-linecap="round">
      <line x1="700" y1="235" x2="700" y2="255"/>
      <line x1="714" y1="222" x2="714" y2="268"/>
      <line x1="728" y1="212" x2="728" y2="278"/>
      <line x1="742" y1="224" x2="742" y2="266"/>
      <line x1="756" y1="238" x2="756" y2="252"/>
    </g>
    <text x="728" y="296" font-size="12" fill="#5f74ad" text-anchor="middle">喇叭外放 · 全程免触摸</text>

    <!-- 语音挂断回环 -->
    <path d="M760 190 C 840 130, 940 130, 1010 180" stroke="#9d6bff" stroke-width="2" fill="none" marker-end="url(#arrowP)"/>
    <text x="905" y="128" font-size="13" fill="#b9a1f5" text-anchor="middle">「那就挂断吧」</text>
    <text x="905" y="148" font-size="12" fill="#7d68a8" text-anchor="middle">自动检测挂断 · 回桌面 · 熄屏 · 循环</text>

    <!-- 云 -->
    <g filter="url(#glow)">
      <rect x="1000" y="180" width="140" height="72" rx="14" fill="#0d1330" stroke="#9d6bff" stroke-width="2"/>
      <text x="1070" y="210" font-size="16" fill="#ffffff" text-anchor="middle">ChatGPT Live</text>
      <text x="1070" y="234" font-size="12" fill="#8fa3d9" text-anchor="middle">Plus · Realtime</text>
    </g>
  </g>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#4f8cff"/>
    </marker>
    <marker id="arrowP" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#9d6bff"/>
    </marker>
  </defs>

  <text x="60" y="400" font-size="13" fill="#5f74ad">Android 9 · 离线唤醒词 · 无障碍自动化 · 麦克风独占协议 · 音频模式挂断检测</text>
</svg>
